name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Test
        run: ./gradlew --no-daemon clean test jacocoTestReport
      - name: Test summary
        # Also runs when tests fail. The table goes to the run's Summary page; one result line goes to this log.
        if: always()
        run: python3 .github/scripts/test_summary.py >> "$GITHUB_STEP_SUMMARY"
