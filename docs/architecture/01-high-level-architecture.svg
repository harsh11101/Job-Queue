<text x="40.0" y="45.8" font-size="28" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Distributed Priority Job Queue — high-level architecture</text>
<text x="40.0" y="76.7" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve">Who talks to whom. Every service replica is identical and runs all four components.</text>
<text x="170.0" y="164.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Operator</text>
<text x="170.0" y="184.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">(browser)</text>
<text x="505.0" y="164.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">API client</text>
<text x="505.0" y="184.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">(any service)</text>
<text x="170.0" y="314.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Job queue dashboard</text>
<text x="170.0" y="334.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">React 19 SPA (Vite)</text>
<text x="170.0" y="354.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">static host / Vercel</text>
<text x="170.0" y="591.6" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Prometheus + Grafana</text>
<text x="170.0" y="609.1" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">optional, started with</text>
<text x="170.0" y="626.6" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">--profile monitoring</text>
<text x="850.0" y="452.9" font-size="14" fill="#7048e8" text-anchor="start" xml:space="preserve">Service · Spring Boot 4 · Java 25 · virtual threads</text>
<text x="850.0" y="470.4" font-size="14" fill="#7048e8" text-anchor="start" xml:space="preserve">N identical replicas</text>
<text x="505.0" y="519.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">REST API</text>
<text x="505.0" y="539.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Spring MVC</text>
<text x="505.0" y="559.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">/api/v1/jobs</text>
<text x="505.0" y="579.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">/actuator</text>
<text x="725.0" y="529.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Outbox publisher</text>
<text x="725.0" y="549.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">@Scheduled</text>
<text x="725.0" y="569.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">every 1 s</text>
<text x="945.0" y="529.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Lease recovery</text>
<text x="945.0" y="549.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">@Scheduled</text>
<text x="945.0" y="569.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">every 30 s</text>
<text x="1165.0" y="531.6" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Kafka workers</text>
<text x="1165.0" y="549.1" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">high 6 · low 2 · retry 3</text>
<text x="1165.0" y="566.6" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">per replica</text>
<text x="1374.0" y="402.9" font-size="14" fill="#e67700" text-anchor="start" xml:space="preserve">Apache Kafka 4 (KRaft)</text>
<text x="1374.0" y="420.4" font-size="14" fill="#e67700" text-anchor="start" xml:space="preserve">6 partitions per topic</text>
<text x="1505.0" y="468.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">jobs-high</text>
<text x="1505.0" y="526.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">jobs-low</text>
<text x="1505.0" y="584.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">jobs-retry-5s</text>
<text x="1505.0" y="642.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">jobs-retry-30s</text>
<text x="1505.0" y="700.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">jobs-retry-2m</text>
<text x="1505.0" y="757.4" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">jobs-dlq</text>
<text x="1505.0" y="774.9" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">(audit only, not consumed)</text>
<text x="710.0" y="744.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">PostgreSQL 18 — source of truth</text>
<text x="710.0" y="764.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">jobs · job_outbox · job_attempts · side_effect_receipts</text>
<text x="1165.0" y="734.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Redis 8</text>
<text x="1165.0" y="754.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">per-job lease</text>
<text x="1165.0" y="774.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">SET NX + TTL 6 min</text>
<text x="180.0" y="227.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">uses</text>
<text x="352.0" y="362.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">REST calls + health poll</text>
<text x="352.0" y="378.2" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">(CORS-checked)</text>
<text x="515.0" y="312.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">POST /api/v1/jobs</text>
<text x="515.0" y="328.2" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">returns after one DB commit</text>
<text x="290.0" y="624.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">scrape</text>
<text x="290.0" y="640.2" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">every 15 s</text>
<text x="512.0" y="640.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">INSERT job + outbox row</text>
<text x="512.0" y="656.2" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">(one transaction)</text>
<text x="732.0" y="640.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">claim due rows</text>
<text x="732.0" y="656.2" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">(SKIP LOCKED)</text>
<text x="740.0" y="398.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">publish to the job&#x27;s topic (acks=all)</text>
<text x="1268.0" y="565.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">consume,</text>
<text x="1268.0" y="581.2" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">manual ack</text>
<text x="952.0" y="640.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">find expired</text>
<text x="952.0" y="656.2" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">leases</text>
<text x="1116.0" y="642.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">state + next</text>
<text x="1116.0" y="658.2" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">outbox row (1 tx)</text>
<text x="1238.0" y="652.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">lease</text>
<text x="60.0" y="712.9" font-size="14" fill="#495057" text-anchor="start" xml:space="preserve">Legend</text>
<text x="98.0" y="737.0" font-size="13" fill="#495057" text-anchor="start" xml:space="preserve">People and callers</text>
<text x="98.0" y="765.0" font-size="13" fill="#495057" text-anchor="start" xml:space="preserve">Frontend</text>
<text x="98.0" y="793.0" font-size="13" fill="#495057" text-anchor="start" xml:space="preserve">Service components</text>
<text x="98.0" y="821.0" font-size="13" fill="#495057" text-anchor="start" xml:space="preserve">Database</text>
<text x="98.0" y="849.0" font-size="13" fill="#495057" text-anchor="start" xml:space="preserve">Kafka topics</text>
<text x="98.0" y="877.0" font-size="13" fill="#495057" text-anchor="start" xml:space="preserve">Redis</text>
<text x="98.0" y="905.0" font-size="13" fill="#495057" text-anchor="start" xml:space="preserve">Optional (dashed): monitoring</text>
<text x="410.0" y="892.9" font-size="14" fill="#495057" text-anchor="start" xml:space="preserve">Coordination between replicas: PostgreSQL row locks (outbox claims) · Kafka consumer groups (partitions) ·</text>
<text x="410.0" y="910.4" font-size="14" fill="#495057" text-anchor="start" xml:space="preserve">Redis leases + fenced end-of-attempt updates (one attempt at a time). Execution is always asynchronous:</text>
<text x="410.0" y="927.9" font-size="14" fill="#495057" text-anchor="start" xml:space="preserve">the API never waits for a job to run.</text>
</svg>
