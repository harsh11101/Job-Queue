<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 -4 1288 853" width="1288" height="853" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="ah0" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#495057"/></marker>
</defs>
<rect x="16" y="-4" width="1288" height="853" fill="#ffffff"/>
<ellipse cx="140.0" cy="335.0" rx="80.0" ry="35.0" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<rect x="290.0" y="290.0" width="200.0" height="90.0" rx="8" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<rect x="640.0" y="290.0" width="220.0" height="90.0" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="3"/>
<rect x="1060.0" y="130.0" width="220.0" height="90.0" rx="8" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
<rect x="1060.0" y="450.0" width="220.0" height="90.0" rx="8" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>
<rect x="640.0" y="570.0" width="220.0" height="90.0" rx="8" fill="#fff9db" stroke="#e67700" stroke-width="2"/>
<polyline points="220.0,335.0 290.0,335.0" fill="none" stroke-linejoin="round" stroke="#495057" stroke-width="2" marker-end="url(#ah0)"/>
<polyline points="490.0,335.0 640.0,335.0" fill="none" stroke-linejoin="round" stroke="#495057" stroke-width="2" marker-end="url(#ah0)"/>
<polyline points="860.0,317.0 960.0,317.0 960.0,175.0 1060.0,175.0" fill="none" stroke-linejoin="round" stroke="#495057" stroke-width="2" marker-end="url(#ah0)"/>
<polyline points="860.0,353.0 960.0,353.0 960.0,495.0 1060.0,495.0" fill="none" stroke-linejoin="round" stroke="#495057" stroke-width="2" marker-end="url(#ah0)"/>
<polyline points="706.0,380.0 706.0,570.0" fill="none" stroke-linejoin="round" stroke="#495057" stroke-width="2" marker-end="url(#ah0)"/>
<polyline points="794.0,570.0 794.0,380.0" fill="none" stroke-linejoin="round" stroke="#495057" stroke-width="2" marker-end="url(#ah0)"/>
<polyline points="1170.0,540.0 1170.0,720.0 390.0,720.0 390.0,380.0" fill="none" stroke-linejoin="round" stroke="#495057" stroke-width="2" marker-end="url(#ah0)"/>
<text x="40.0" y="45.8" font-size="28" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Job lifecycle — states and transitions</text>
<text x="40.0" y="76.7" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve">Every transition out of PROCESSING is a fenced update: the worker or the recovery task ends an attempt, never both.</text>
<text x="140.0" y="339.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Client</text>
<text x="390.0" y="330.4" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">QUEUED</text>
<text x="390.0" y="347.9" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">job + outbox row saved</text>
<text x="750.0" y="330.4" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">PROCESSING</text>
<text x="750.0" y="347.9" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">a worker holds the lease</text>
<text x="1170.0" y="169.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">SUCCEEDED</text>
<text x="1170.0" y="189.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">terminal</text>
<text x="1170.0" y="489.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">DLQ</text>
<text x="1170.0" y="509.7" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">terminal until replayed</text>
<text x="750.0" y="610.4" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">RETRY_SCHEDULED</text>
<text x="750.0" y="627.9" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">waits for next_retry_at</text>
<text x="222.0" y="262.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">POST</text>
<text x="222.0" y="278.2" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">/api/v1/jobs</text>
<text x="500.0" y="252.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">outbox publishes;</text>
<text x="500.0" y="268.2" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">worker takes lease</text>
<text x="968.0" y="240.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">job ran OK</text>
<text x="968.0" y="256.2" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">(fenced commit)</text>
<text x="968.0" y="384.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">permanent failure,</text>
<text x="968.0" y="400.2" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">or last attempt failed,</text>
<text x="968.0" y="416.5" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">or lease expired on</text>
<text x="968.0" y="432.7" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">the last attempt</text>
<text x="520.0" y="452.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">retryable failure,</text>
<text x="520.0" y="468.2" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">attempts left, or lease</text>
<text x="520.0" y="484.5" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">expired (recovery task)</text>
<text x="802.0" y="467.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">retry topic delivers</text>
<text x="802.0" y="483.2" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">(5 s · 30 s · 2 min)</text>
<text x="470.0" y="740.0" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">POST /api/v1/jobs/{id}/replay</text>
<text x="470.0" y="756.2" font-size="13" fill="#343a40" text-anchor="start" xml:space="preserve">one more attempt; the attempt count keeps counting</text>
<text x="60.0" y="802.9" font-size="14" fill="#495057" text-anchor="start" xml:space="preserve">Retry delays are set by app.job-queue.retry.* (first 5 s, second 30 s, every later one 2 min).</text>
<text x="60.0" y="820.4" font-size="14" fill="#495057" text-anchor="start" xml:space="preserve">maxAttempts defaults to 4 (1–20 per job). Messages for a SUCCEEDED or DLQ job are acknowledged and skipped.</text>
</svg>
