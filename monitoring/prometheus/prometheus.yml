global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: job-queue
    metrics_path: /actuator/prometheus
    static_configs:
      # The service publishes port 8080 on the host whether it runs as the compose `app`
      # container or through `./gradlew bootRun`, so one target covers both.
      - targets: ["host.docker.internal:8080"]
        labels:
          service: job-queue
