server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: distributed-priority-job-queue
  threads:
    virtual:
      # Tomcat request handling and @Scheduled tasks run on virtual threads.
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobs}
    username: ${DB_USERNAME:jobs}
    password: ${DB_PASSWORD:jobs}
    hikari:
      # Virtual threads make concurrency cheap, so the pool is the real bound on
      # database load. Requests beyond it wait up to connection-timeout (ms) for a connection.
      maximum-pool-size: ${DB_POOL_SIZE:32}
      minimum-idle: 4
      connection-timeout: 5000
      idle-timeout: 600000
  jdbc:
    template:
      # Bounds every SQL statement so a stuck query cannot hold a worker forever.
      query-timeout: 30s
  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 20
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Lettuce multiplexes commands from all virtual threads over one shared,
      # thread-safe connection, so no connection pool is needed.
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      cors:
        # Same origins as the API (app.job-queue.cors), so one setting covers both.
        allowed-origins: ${app.job-queue.cors.allowed-origins}
        allowed-methods: GET
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.github.pants.jobqueue: INFO
    org.apache.kafka.clients.consumer.internals: WARN

app:
  job-queue:
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
      consumer-group-id: distributed-job-queue-workers
      topic-partitions: 6
      topic-replicas: 1
      max-poll-records: 32
    topics:
      high: jobs-high
      low: jobs-low
      retry-5s: jobs-retry-5s
      retry-30s: jobs-retry-30s
      retry-2m: jobs-retry-2m
      dlq: jobs-dlq
    worker:
      high-concurrency: 6
      low-concurrency: 2
      retry-concurrency: 3
      lock-ttl: 6m
      processing-timeout: 5m
      # Jobs still PROCESSING after their lease (lock-ttl) ended are retried by a task on this interval.
      lease-recovery-delay-ms: 30000
    retry:
      first-delay: 5s
      second-delay: 30s
      third-delay: 2m
      default-max-attempts: 4
    outbox:
      enabled: true
      batch-size: 100
      fixed-delay-ms: 1000
      publish-concurrency: 8
      publishing-timeout: 5m
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
